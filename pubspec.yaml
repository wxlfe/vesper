name: vesper
description: "Privacy-first prayer request and pastoral care app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.4.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.2.0
  intl: ^0.20.2
  mobile_scanner: ^7.1.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/title-graphic.png
